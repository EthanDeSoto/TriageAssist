services:
  - type: web
    name: triage-assist-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: FRONTEND_URL
        sync: false
